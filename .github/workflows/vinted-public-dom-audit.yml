name: Vinted Public DOM Audit

on:
  pull_request:
    branches: [main]

jobs:
  public-vinted-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install audit browser
        run: |
          mkdir -p /tmp/vinted-dom-audit/evidence
          cd /tmp/vinted-dom-audit
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.0
          npx playwright install --with-deps chromium

      - name: Probe current public Vinted DOM without account actions
        id: probe
        working-directory: /tmp/vinted-dom-audit
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';

          const PHONE = 'https://www.vinted.pl/catalog/3661-mobilie-talruni';
          const SAMSUNG = 'https://www.vinted.pl/catalog/3661-mobilie-talruni/brand/109048-samsung';
          const HOME = 'https://www.vinted.pl/';
          const failures = [];
          const fail = message => { failures.push(message); console.log('AUDIT_FAILURE=' + message); };
          const norm = value => (value || '').replace(/\s+/g, ' ').trim();
          const cardSelector = "[data-testid^='product-item-id-']:not([data-testid*='--'])";

          async function ev(locator, limit = 60) {
            const out = [];
            for (let i = 0; i < Math.min(await locator.count(), limit); i++) {
              const el = locator.nth(i);
              if (!(await el.isVisible().catch(() => false))) continue;
              out.push({
                tag: await el.evaluate(n => n.tagName.toLowerCase()).catch(() => null),
                text: norm(await el.innerText().catch(() => '')).slice(0, 220),
                role: await el.getAttribute('role'),
                testId: await el.getAttribute('data-testid'),
                id: await el.getAttribute('id'),
                name: await el.getAttribute('name'),
                type: await el.getAttribute('type'),
                aria: await el.getAttribute('aria-label'),
                placeholder: await el.getAttribute('placeholder')
              });
            }
            return out;
          }

          async function panelEvidence(page, label) {
            console.log(label + '.inputs=' + JSON.stringify(await ev(page.locator('input:visible'))));
            console.log(label + '.dialogs=' + JSON.stringify(await ev(page.locator("[role='dialog']:visible, [aria-modal='true']:visible"), 20)));
            console.log(label + '.testids=' + JSON.stringify(await ev(page.locator("[data-testid]:visible"), 120)));
          }

          async function waitCards(page) {
            await page.locator(cardSelector).first().waitFor({ state: 'attached', timeout: 30000 });
          }

          function isExactS25(text) {
            const v = norm(text);
            if (/^Galaxy S25$/i.test(v)) return true;
            if (!/^Galaxy S25\s+/i.test(v)) return false;
            const suffix = v.replace(/^Galaxy S25\s+/i, '');
            return /^\d[\d\s.,]*(?:\s*przedmiot\p{L}*)?$/iu.test(suffix);
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'pl-PL', timezoneId: 'Europe/Warsaw', viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();

          try {
            console.log('=== CORE CATALOG ===');
            await page.goto(PHONE, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await waitCards(page);
            const cards = page.locator(cardSelector);
            console.log('core.cardCount=' + await cards.count());
            const card = cards.first();
            const requiredCardSelectors = {
              title: "[data-testid$='--description-title']",
              subtitle: "[data-testid$='--description-subtitle']",
              price: "[data-testid$='--price-text']",
              image: "[data-testid$='--image--img']",
              link: "[data-testid$='--overlay-link']"
            };
            for (const [name, selector] of Object.entries(requiredCardSelectors)) {
              const count = await card.locator(selector).count();
              console.log(`core.${name}=${count}`);
              if (count === 0) fail(`required card selector missing: ${name}`);
            }
            console.log('core.favorites=' + await card.locator("[data-testid='favourite-count-text']").count() + ' optional');
            if (await page.locator("form[action='/catalog'] input[name='search_text']:visible").count() === 0) fail('catalog search selector missing');
            for (const id of ['catalog--catalog-filter--trigger','catalog--brand-filter--trigger','catalog--brand_collection-filter--trigger','catalog--price-filter--trigger','catalog--sort-filter--trigger']) {
              const count = await page.getByTestId(id).count();
              console.log(`core.${id}=${count}`);
              if (count === 0) fail(`filter trigger missing: ${id}`);
            }

            console.log('=== BRAND FILTER ===');
            await page.getByTestId('catalog--brand-filter--trigger').click();
            await page.waitForTimeout(4000);
            await page.screenshot({ path: 'evidence/brand.png', fullPage: false });
            console.log('brand.oldConfirm=' + await page.locator("[data-testid='filter-selection-button']:visible").count());
            console.log('brand.showAll=' + await page.locator("[data-testid='show-all-items']:visible").count());
            console.log('brand.samsungExact=' + JSON.stringify(await ev(page.getByText('Samsung', { exact: true }))));
            console.log('brand.samsungButtons=' + await page.getByRole('button', { name: 'Samsung', exact: true }).count());
            await panelEvidence(page, 'brand');

            console.log('=== MODEL FILTER ===');
            await page.goto(SAMSUNG, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await waitCards(page);
            await page.getByTestId('catalog--brand_collection-filter--trigger').click();
            await page.waitForTimeout(4000);
            await page.screenshot({ path: 'evidence/model.png', fullPage: false });
            console.log('model.oldConfirm=' + await page.locator("[data-testid='filter-selection-button']:visible").count());
            console.log('model.showAll=' + await page.locator("[data-testid='show-all-items']:visible").count());
            await panelEvidence(page, 'model');
            const search = page.locator('#brand_collection_filter_search:visible');
            console.log('model.search=' + await search.count());
            if (await search.count() === 0) {
              fail('model search input #brand_collection_filter_search missing after panel settled');
            } else {
              await search.fill('Galaxy S25');
              await page.waitForTimeout(1500);
              const rows = page.locator("[data-testid^='selectable-item-brand_collection-']:not([data-testid$='--title']):visible");
              console.log('model.rows=' + await rows.count());
              console.log('model.rowEvidence=' + JSON.stringify(await ev(rows, 40)));
              let exact = null;
              for (let i = 0; i < Math.min(await rows.count(), 40); i++) {
                if (isExactS25(await rows.nth(i).innerText())) { exact = rows.nth(i); break; }
              }
              if (exact === null) {
                fail('exact Galaxy S25 row not found');
              } else {
                const tid = await exact.getAttribute('data-testid');
                const id = (tid || '').match(/^selectable-item-brand_collection-(\d+)$/)?.[1];
                console.log('model.exactTestId=' + tid);
                if (!id) {
                  fail('exact Galaxy S25 row has unexpected testid');
                } else {
                  await exact.click();
                  await page.waitForTimeout(1200);
                  let persisted = new URL(page.url()).searchParams.getAll('brand_collection_ids[]').includes(id);
                  console.log('model.persistedBeforeConfirm=' + persisted);
                  console.log('model.afterSelect.url=' + page.url());
                  const currentConfirm = page.locator("[data-testid='show-all-items']:visible");
                  console.log('model.currentConfirm=' + await currentConfirm.count());
                  if (!persisted && await currentConfirm.count() > 0) {
                    console.log('model.clickingShowAllItems=true');
                    await currentConfirm.first().click();
                    await page.waitForTimeout(1800);
                    persisted = new URL(page.url()).searchParams.getAll('brand_collection_ids[]').includes(id);
                    console.log('model.persistedAfterShowAll=' + persisted);
                    console.log('model.afterConfirm.url=' + page.url());
                  }
                  if (!persisted) fail('Galaxy S25 collection id did not persist through current Vinted UI');
                }
              }
            }

            console.log('=== PRICE FILTER ===');
            await page.goto(PHONE, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await waitCards(page);
            await page.getByTestId('catalog--price-filter--trigger').click();
            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'evidence/price.png', fullPage: false });
            console.log('price.from=' + await page.locator('#price_from:visible').count());
            console.log('price.to=' + await page.locator('#price_to:visible').count());
            console.log('price.oldConfirm=' + await page.locator("[data-testid='filter-selection-button']:visible").count());
            console.log('price.showAll=' + await page.locator("[data-testid='show-all-items']:visible").count());
            if (await page.locator('#price_from:visible').count() === 0 || await page.locator('#price_to:visible').count() === 0) fail('price inputs changed');

            console.log('=== SORT FILTER ===');
            await page.goto(PHONE, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await waitCards(page);
            await page.getByTestId('catalog--sort-filter--trigger').click();
            await page.waitForTimeout(1800);
            console.log('sort.newest=' + await page.locator('#sort_by-list-item-newest_first:visible').count());
            if (await page.locator('#sort_by-list-item-newest_first:visible').count() === 0) fail('newest sort selector changed');

            console.log('=== ITEM DETAIL ===');
            await page.goto(PHONE, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await waitCards(page);
            let href = await page.locator(cardSelector).first().locator("[data-testid$='--overlay-link']").getAttribute('href');
            if (!href) {
              fail('listing href missing');
            } else {
              if (href.startsWith('/')) href = 'https://www.vinted.pl' + href;
              await page.goto(href, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(1800);
              await page.screenshot({ path: 'evidence/detail.png', fullPage: false });
              console.log('detail.url=' + page.url());
              console.log('detail.summary=' + await page.locator("[data-testid='item-page-summary-plugin']:visible").count());
              console.log('detail.h1=' + await page.locator("[data-testid='item-page-summary-plugin'] h1:visible").count());
              console.log('detail.offerButton=' + await page.locator("[data-testid='item-buyer-offer-button']:visible").count());
              console.log('detail.offerLike=' + JSON.stringify(await ev(page.locator("[data-testid*='offer']:visible, [data-testid*='message']:visible, [data-testid*='composer']:visible"), 80)));
              if (await page.locator("[data-testid='item-page-summary-plugin']:visible").count() === 0) fail('item summary plugin changed');
            }

            console.log('=== LOGIN FLOW / NO CREDENTIALS ===');
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 45000 });
            const cookie = page.locator('#onetrust-accept-btn-handler');
            if (await cookie.isVisible().catch(() => false)) await cookie.click();
            const login = page.locator("[data-testid='header--login-button']:visible");
            console.log('login.header=' + await login.count());
            if (await login.count() === 0) {
              fail('header login selector changed');
            } else {
              await login.click();
              await page.waitForTimeout(2500);
              await page.screenshot({ path: 'evidence/login.png', fullPage: false });
              console.log('login.auth=' + JSON.stringify(await ev(page.locator("[data-testid*='auth-']:visible, [data-testid^='select-type-']:visible"), 80)));
              const regSwitch = page.locator("[data-testid='auth-select-type--register-switch']:visible");
              if (await regSwitch.count() > 0) { await regSwitch.click(); await page.waitForTimeout(1200); }
              const emailChoice = page.locator("[data-testid='auth-select-type--login-email']:visible");
              if (await emailChoice.count() > 0) { await emailChoice.click(); await page.waitForTimeout(1200); }
              console.log('login.username=' + await page.locator('#username:visible').count());
              console.log('login.password=' + await page.locator('#password:visible').count());
              if (await page.locator('#username:visible').count() === 0 || await page.locator('#password:visible').count() === 0) fail('email/password login selectors changed');
            }

            console.log('AUDIT_FAILURES=' + JSON.stringify(failures));
            if (failures.length > 0) throw new Error('Vinted DOM audit found ' + failures.length + ' incompatibility(s): ' + failures.join(' | '));
            console.log('VINTED_PUBLIC_DOM_AUDIT_OK');
          } finally {
            await context.close();
            await browser.close();
          }
          EOF

          node audit.mjs

      - name: Upload live DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinted-public-dom-evidence
          path: /tmp/vinted-dom-audit/evidence
          if-no-files-found: ignore
