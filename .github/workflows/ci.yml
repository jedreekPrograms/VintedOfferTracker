name: CI

on:
  push:
    branches:
      - main
      - "carlisle/**"
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flipbot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flipbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flipbot
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Historical Flyway migrations start from an already-existing Hibernate
      # schema, so a clean CI database cannot replay V1 safely. For the context
      # test we let Hibernate build an isolated schema. Audit migrations that
      # must alter an existing installation are exercised explicitly below in
      # a dedicated PostgreSQL schema that models the pre-V33 contract.
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        shell: bash
        run: |
          # The converter requires a Base64-encoded 32-byte AES key. Generate a
          # deterministic non-secret value only for this disposable CI process.
          export FLIPBOT_ENCRYPTION_KEY="$(printf '00000000000000000000000000000000' | base64 -w0)"
          bash ./mvnw -B test

      - name: Smoke-test V33/V34 and cross-bot release SQL
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d flipbot -v ON_ERROR_STOP=1 <<'SQL'
          DROP SCHEMA IF EXISTS migration_smoke CASCADE;
          CREATE SCHEMA migration_smoke;
          SET search_path TO migration_smoke;

          CREATE TABLE bot (
              id BIGINT PRIMARY KEY
          );

          CREATE TABLE bot_configuration (
              bot_id BIGINT PRIMARY KEY,
              marketplace VARCHAR(64) NOT NULL
          );

          CREATE TABLE listing (
              id BIGINT PRIMARY KEY,
              listing_id VARCHAR(255) NOT NULL,
              bot_id BIGINT NOT NULL,
              status VARCHAR(64) NOT NULL,
              current_step INTEGER,
              conversation_id VARCHAR(255),
              current_step_started_at TIMESTAMP WITHOUT TIME ZONE,
              decision_at TIMESTAMP WITHOUT TIME ZONE,
              CONSTRAINT listing_status_check
                  CHECK (
                      status IN (
                          'DISCOVERED',
                          'NEGOTIATING',
                          'ACTION_REQUIRED',
                          'SKIPPED_OFFER_TOO_LOW',
                          'SKIPPED_OUTSIDE_PRICE_RANGE',
                          'SKIPPED_CANNOT_NEGOTIATE',
                          'SKIPPED_TARGET_MISMATCH',
                          'SKIPPED_BY_USER',
                          'UNAVAILABLE',
                          'CONTACT_UNAVAILABLE',
                          'REJECTED',
                          'EXPIRED',
                          'PURCHASED',
                          'FINISHED'
                      )
                  )
          );

          CREATE TABLE real_action_guard (
              id BIGSERIAL PRIMARY KEY,
              listing_id BIGINT NOT NULL,
              request_id UUID NOT NULL,
              action_type VARCHAR(64) NOT NULL,
              created_at TIMESTAMP WITHOUT TIME ZONE NOT NULL
          );

          CREATE TABLE bot_command (
              id BIGINT PRIMARY KEY,
              bot_id BIGINT NOT NULL,
              listing_id BIGINT NOT NULL,
              CONSTRAINT fk_bot_command_bot
                  FOREIGN KEY (bot_id) REFERENCES bot (id),
              CONSTRAINT fk_bot_command_listing
                  FOREIGN KEY (listing_id) REFERENCES listing (id)
          );

          CREATE TABLE negotiation_step (
              id BIGINT PRIMARY KEY
          );

          INSERT INTO bot (id) VALUES (1), (2);
          INSERT INTO bot_configuration (bot_id, marketplace)
          VALUES (1, 'VINTED'), (2, 'VINTED');

          INSERT INTO listing (
              id, listing_id, bot_id, status, current_step,
              conversation_id, current_step_started_at, decision_at
          ) VALUES
              (11, '9717432736', 1, 'NEGOTIATING', 1, 'conv-11', CURRENT_TIMESTAMP, NULL),
              (22, '9800000000', 2, 'DISCOVERED', 0, NULL, NULL, NULL);

          INSERT INTO bot_command (id, bot_id, listing_id)
          VALUES (101, 1, 11), (102, 2, 22);

          INSERT INTO negotiation_step (id) VALUES (1);

          \i src/main/resources/db/migration/V33__protect_cross_bot_negotiations_and_bot_deletion.sql
          \i src/main/resources/db/migration/V34__configure_read_and_unread_follow_up_delays.sql

          DO $$
          BEGIN
              IF (SELECT COUNT(*) FROM marketplace_negotiation_claim
                  WHERE marketplace = 'VINTED'
                    AND marketplace_listing_id = '9717432736'
                    AND owner_bot_id = 1
                    AND owner_listing_id = 11) <> 1 THEN
                  RAISE EXCEPTION 'V33 did not backfill the known active negotiation claim';
              END IF;

              UPDATE listing
              SET status = 'SKIPPED_ALREADY_NEGOTIATED'
              WHERE id = 22;

              IF (SELECT status FROM listing WHERE id = 22) <> 'SKIPPED_ALREADY_NEGOTIATED' THEN
                  RAISE EXCEPTION 'V33 listing status constraint did not accept SKIPPED_ALREADY_NEGOTIATED';
              END IF;

              IF (SELECT read_wait_hours FROM negotiation_step WHERE id = 1) <> 3
                 OR (SELECT unread_wait_hours FROM negotiation_step WHERE id = 1) <> 48 THEN
                  RAISE EXCEPTION 'V34 did not backfill 3h/48h defaults on an existing negotiation step';
              END IF;
          END
          $$;

          INSERT INTO negotiation_step (id) VALUES (2);

          DO $$
          BEGIN
              IF (SELECT read_wait_hours FROM negotiation_step WHERE id = 2) <> 3
                 OR (SELECT unread_wait_hours FROM negotiation_step WHERE id = 2) <> 48 THEN
                  RAISE EXCEPTION 'V34 defaults are not applied to newly inserted negotiation steps';
              END IF;

              BEGIN
                  INSERT INTO negotiation_step (id, read_wait_hours, unread_wait_hours)
                  VALUES (3, 0, 48);
                  RAISE EXCEPTION 'V34 read_wait_hours CHECK did not reject zero';
              EXCEPTION
                  WHEN check_violation THEN NULL;
              END;

              BEGIN
                  INSERT INTO negotiation_step (id, read_wait_hours, unread_wait_hours)
                  VALUES (4, 3, 721);
                  RAISE EXCEPTION 'V34 unread_wait_hours CHECK did not reject 721';
              EXCEPTION
                  WHEN check_violation THEN NULL;
              END;
          END
          $$;

          -- Exercise the exact SQL shape used when a temporary FIRST_OFFER
          -- owner proves that no submit happened and releases its claim. The
          -- losing per-bot tombstone must be reopened without weakening durable
          -- claims used after confirmed or ambiguous submit attempts.
          INSERT INTO bot (id) VALUES (3), (4);
          INSERT INTO bot_configuration (bot_id, marketplace)
          VALUES (3, 'VINTED'), (4, 'VINTED');

          INSERT INTO listing (
              id, listing_id, bot_id, status, current_step,
              conversation_id, current_step_started_at, decision_at
          ) VALUES
              (33, '9900000000', 3, 'DISCOVERED', 0, NULL, NULL, NULL),
              (44, '9900000000', 4, 'SKIPPED_ALREADY_NEGOTIATED', 0, NULL, NULL, CURRENT_TIMESTAMP);

          INSERT INTO marketplace_negotiation_claim (
              marketplace, marketplace_listing_id, owner_bot_id,
              owner_listing_id, request_id, claimed_at
          ) VALUES (
              'VINTED', '9900000000', 3, 33,
              '00000000-0000-0000-0000-000000000033', CURRENT_TIMESTAMP
          );

          DELETE FROM marketplace_negotiation_claim
          WHERE marketplace = 'VINTED'
            AND marketplace_listing_id = '9900000000'
            AND owner_bot_id = 3
            AND owner_listing_id = 33
            AND request_id = '00000000-0000-0000-0000-000000000033';

          WITH reopenable AS (
              SELECT losing_listing.id
              FROM listing AS losing_listing
              JOIN bot_configuration AS configuration
                ON losing_listing.bot_id = configuration.bot_id
              WHERE configuration.marketplace = 'VINTED'
                AND losing_listing.listing_id = '9900000000'
                AND losing_listing.status = 'SKIPPED_ALREADY_NEGOTIATED'
              FOR UPDATE OF losing_listing SKIP LOCKED
          )
          UPDATE listing AS losing_listing
          SET status = 'DISCOVERED',
              decision_at = NULL
          FROM reopenable
          WHERE losing_listing.id = reopenable.id;

          DO $$
          BEGIN
              IF (SELECT status FROM listing WHERE id = 44) <> 'DISCOVERED'
                 OR (SELECT decision_at FROM listing WHERE id = 44) IS NOT NULL THEN
                  RAISE EXCEPTION 'Pre-submit claim release SQL did not reopen the competing listing';
              END IF;
          END
          $$;

          DELETE FROM listing WHERE id = 11;

          DO $$
          BEGIN
              IF EXISTS (SELECT 1 FROM bot_command WHERE id = 101) THEN
                  RAISE EXCEPTION 'V33 listing FK did not cascade bot_command deletion';
              END IF;

              IF NOT EXISTS (
                  SELECT 1 FROM marketplace_negotiation_claim
                  WHERE marketplace = 'VINTED'
                    AND marketplace_listing_id = '9717432736'
              ) THEN
                  RAISE EXCEPTION 'Durable marketplace claim was incorrectly deleted with its listing';
              END IF;
          END
          $$;

          DELETE FROM bot WHERE id = 2;

          DO $$
          BEGIN
              IF EXISTS (SELECT 1 FROM bot_command WHERE id = 102) THEN
                  RAISE EXCEPTION 'V33 bot FK did not cascade bot_command deletion';
              END IF;
          END
          $$;

          DROP SCHEMA migration_smoke CASCADE;
          SQL

  playwright-unit:
    name: Playwright unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test Playwright module
        run: mvn -B test
