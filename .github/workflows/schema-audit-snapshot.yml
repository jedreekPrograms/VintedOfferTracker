name: Schema Audit Snapshot

on:
  push:
    branches:
      - audit/database-baseline-stage-3

permissions:
  contents: read

jobs:
  hibernate-schema-snapshot:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flipbot_schema_audit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flipbot_schema_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flipbot_schema_audit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend jar
        shell: bash
        run: |
          export FLIPBOT_ENCRYPTION_KEY="$(printf '00000000000000000000000000000000' | base64 -w0)"
          bash ./mvnw -B -DskipTests package

      - name: Generate canonical Hibernate PostgreSQL schema
        shell: bash
        run: |
          set -euo pipefail
          export FLIPBOT_ENCRYPTION_KEY="$(printf '00000000000000000000000000000000' | base64 -w0)"

          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "$JAR"

          java -jar "$JAR" > target/schema-audit-app.log 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID" || true
              wait "$APP_PID" || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if psql -h localhost -U postgres -d flipbot_schema_audit -Atqc \
              "SELECT CASE WHEN to_regclass('public.bot') IS NOT NULL THEN 1 ELSE 0 END" \
              | grep -qx '1'; then
              ready=1
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo 'Backend exited before Hibernate created the schema.' >&2
              cat target/schema-audit-app.log >&2
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Timed out waiting for Hibernate schema creation.' >&2
            cat target/schema-audit-app.log >&2
            exit 1
          fi

          # GitHub's Ubuntu image may ship an older pg_dump than the PostgreSQL
          # service. Use the exact postgres:17 toolchain so schema extraction
          # cannot fail because of a client/server major-version mismatch.
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:17 \
            pg_dump \
              -h 127.0.0.1 \
              -U postgres \
              -d flipbot_schema_audit \
              --schema-only \
              --no-owner \
              --no-privileges \
              --schema=public \
            > target/hibernate-schema.sql

          echo '===== HIBERNATE_SCHEMA_BEGIN ====='
          cat target/hibernate-schema.sql
          echo '===== HIBERNATE_SCHEMA_END ====='

      - name: Upload schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hibernate-postgres-schema
          path: |
            backend/target/hibernate-schema.sql
            backend/target/schema-audit-app.log
          if-no-files-found: warn
