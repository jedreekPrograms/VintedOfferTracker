name: Database Baseline Verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  clean-database-flyway-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flipbot_baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flipbot_baseline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flipbot_baseline
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FLIPBOT_SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: "18080"
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend jar
        shell: bash
        run: |
          export FLIPBOT_ENCRYPTION_KEY="$(printf '00000000000000000000000000000000' | base64 -w0)"
          bash ./mvnw -B -DskipTests package

      - name: Start from an absolutely empty database with Flyway and Hibernate validate
        shell: bash
        run: |
          set -euo pipefail
          export FLIPBOT_ENCRYPTION_KEY="$(printf '00000000000000000000000000000000' | base64 -w0)"

          if psql -h localhost -U postgres -d flipbot_baseline -Atqc \
            "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'public'" \
            | grep -vq '^0$'; then
            echo 'Database was not empty before application startup.' >&2
            exit 1
          fi

          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          test -n "$JAR"

          java -jar "$JAR" > target/baseline-verify-app.log 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID" || true
              wait "$APP_PID" || true
            fi
          }
          trap cleanup EXIT

          healthy=0
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:18080/actuator/health \
              | grep -q '"status":"UP"'; then
              healthy=1
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo 'Backend exited before reaching a healthy state.' >&2
              cat target/baseline-verify-app.log >&2
              exit 1
            fi

            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo 'Timed out waiting for a healthy backend.' >&2
            cat target/baseline-verify-app.log >&2
            exit 1
          fi

          if grep -Eiq 'schema-validation|SchemaManagementException|migration.*failed|Flyway.*error' \
              target/baseline-verify-app.log; then
            echo 'Backend log contains a schema/migration validation failure.' >&2
            cat target/baseline-verify-app.log >&2
            exit 1
          fi

          echo '===== FLYWAY HISTORY ====='
          psql -h localhost -U postgres -d flipbot_baseline -c \
            'SELECT installed_rank, version, description, type, success FROM flyway_schema_history ORDER BY installed_rank;'

          echo '===== BACKEND STARTUP TAIL ====='
          tail -n 100 target/baseline-verify-app.log

      - name: Verify baseline schema invariants
        shell: bash
        run: |
          set -euo pipefail

          psql -h localhost -U postgres -d flipbot_baseline -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              required_table text;
          BEGIN
              FOREACH required_table IN ARRAY ARRAY[
                  'bot',
                  'bot_configuration',
                  'bot_category_path',
                  'bot_command',
                  'bot_runtime_state',
                  'daily_offer_quota',
                  'dictionary_brand',
                  'dictionary_category',
                  'dictionary_model',
                  'listing',
                  'market_listing_observation',
                  'market_model_scan_state',
                  'negotiation_step',
                  'negotiation_step_counter_offer_rule',
                  'price_probe',
                  'real_action_audit',
                  'real_action_guard',
                  'marketplace_negotiation_claim'
              ] LOOP
                  IF to_regclass('public.' || required_table) IS NULL THEN
                      RAISE EXCEPTION 'Missing baseline table: %', required_table;
                  END IF;
              END LOOP;

              IF (SELECT COUNT(*) FROM bot WHERE market_stats_observer = TRUE) <> 1 THEN
                  RAISE EXCEPTION 'Fresh baseline must create exactly one market-stats observer';
              END IF;

              IF EXISTS (
                  SELECT 1
                  FROM bot
                  WHERE market_stats_observer = TRUE
                    AND (email IS NOT NULL OR password IS NOT NULL OR status <> 'STOPPED')
              ) THEN
                  RAISE EXCEPTION 'Fresh market-stats observer is not anonymous/stopped';
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conname = 'chk_daily_offer_quota_used_count'
                    AND conrelid = 'daily_offer_quota'::regclass
              ) THEN
                  RAISE EXCEPTION 'Missing non-negative quota constraint';
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conname = 'ck_real_action_guard_step_number'
                    AND conrelid = 'real_action_guard'::regclass
              ) THEN
                  RAISE EXCEPTION 'Missing real-action guard step constraint';
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conname = 'ck_real_action_audit_offer_price'
                    AND conrelid = 'real_action_audit'::regclass
              ) THEN
                  RAISE EXCEPTION 'Missing real-action audit price constraint';
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM pg_indexes
                  WHERE schemaname = 'public'
                    AND indexname = 'idx_marketplace_negotiation_claim_unconfirmed_owner'
                    AND indexdef ILIKE '%WHERE (confirmed_at IS NULL)%'
              ) THEN
                  RAISE EXCEPTION 'Missing partial index for unresolved marketplace claims';
              END IF;

              IF (
                  SELECT COUNT(*)
                  FROM pg_constraint
                  WHERE conrelid = 'bot_command'::regclass
                    AND contype = 'f'
                    AND confdeltype = 'c'
              ) <> 2 THEN
                  RAISE EXCEPTION 'bot_command foreign keys must both cascade on delete';
              END IF;
          END
          $$;

          DO $$
          DECLARE
              observer_id bigint;
          BEGIN
              SELECT id INTO observer_id
              FROM bot
              WHERE market_stats_observer = TRUE
              LIMIT 1;

              BEGIN
                  INSERT INTO daily_offer_quota(bot_id, usage_date, used_count)
                  VALUES (observer_id, CURRENT_DATE, -1);
                  RAISE EXCEPTION 'Negative quota was unexpectedly accepted';
              EXCEPTION
                  WHEN check_violation THEN NULL;
              END;
          END
          $$;
          SQL

      - name: Upload baseline verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-baseline-verification
          path: backend/target/baseline-verify-app.log
          if-no-files-found: warn
