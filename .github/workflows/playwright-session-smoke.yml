name: Playwright Encrypted Session Browser Smoke

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  encrypted-session-browser-smoke:
    name: Encrypted session Chromium smoke
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Playwright Chromium
        run: >-
          mvn -B
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Restore encrypted storage state in real Chromium
        shell: bash
        run: |
          export FLIPBOT_SESSION_ENCRYPTION_KEY="$(printf '11111111111111111111111111111111' | base64 -w0)"
          export FLIPBOT_BROWSER_SESSION_SMOKE=true
          mvn -B -Dtest=EncryptedSessionBrowserSmokeTest test
