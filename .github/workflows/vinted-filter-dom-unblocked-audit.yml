name: Vinted Filter DOM Unblocked Audit

on:
  pull_request:
    branches: [main]

jobs:
  current-vinted-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          mkdir -p /tmp/vinted-filter-audit/evidence
          cd /tmp/vinted-filter-audit
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.0
          npx playwright install --with-deps chromium
      - name: Diagnose live Vinted filter trigger
        working-directory: /tmp/vinted-filter-audit
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';

          const PHONE = 'https://www.vinted.pl/catalog/3661-mobilie-talruni';
          const CARD = "[data-testid^='product-item-id-']:not([data-testid*='--'])";
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'pl-PL', timezoneId: 'Europe/Warsaw', viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();

          async function resolveKnownOverlays() {
            const cookie = page.locator('#onetrust-accept-btn-handler:visible');
            if (await cookie.count() > 0) {
              console.log('cookieBanner=present');
              await cookie.click();
              await page.waitForTimeout(500);
            } else {
              console.log('cookieBanner=absent');
            }

            const modal = page.locator("[data-testid='domain-select-modal']:visible");
            if (await modal.count() > 0) {
              console.log('countryModal=present');
              const poland = modal.getByText('Polska', { exact: true });
              if (await poland.count() === 0) throw new Error('Country modal visible but Polska missing');
              await poland.first().scrollIntoViewIfNeeded();
              await poland.first().click();
              await modal.waitFor({ state: 'hidden', timeout: 15000 });
              await page.waitForTimeout(800);
            } else {
              console.log('countryModal=absent');
            }
          }

          async function describePoint(x, y) {
            return await page.evaluate(({ x, y }) => {
              const el = document.elementFromPoint(x, y);
              if (!el) return null;
              const chain = [];
              let current = el;
              for (let i = 0; current && i < 6; i++, current = current.parentElement) {
                chain.push({
                  tag: current.tagName?.toLowerCase?.() ?? null,
                  id: current.id || null,
                  role: current.getAttribute?.('role') || null,
                  testId: current.getAttribute?.('data-testid') || null,
                  aria: current.getAttribute?.('aria-label') || null,
                  text: (current.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 160),
                  pointerEvents: getComputedStyle(current).pointerEvents,
                  position: getComputedStyle(current).position,
                  zIndex: getComputedStyle(current).zIndex
                });
              }
              return chain;
            }, { x, y });
          }

          async function visibleDialogs() {
            return await page.locator("[role='dialog']:visible, [aria-modal='true']:visible, [data-testid*='modal']:visible").evaluateAll(elements =>
              elements.map(el => ({
                tag: el.tagName.toLowerCase(),
                testId: el.getAttribute('data-testid'),
                role: el.getAttribute('role'),
                ariaModal: el.getAttribute('aria-modal'),
                text: (el.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 300)
              }))
            );
          }

          async function panelState(label) {
            const trigger = page.getByTestId('catalog--brand-filter--trigger');
            console.log(label + '.ariaExpanded=' + await trigger.getAttribute('aria-expanded'));
            console.log(label + '.ariaControls=' + await trigger.getAttribute('aria-controls'));
            console.log(label + '.ariaHasPopup=' + await trigger.getAttribute('aria-haspopup'));
            console.log(label + '.brandSearchCandidates=' + await page.locator("input[id*='brand']:visible, input[data-testid*='brand']:visible").count());
            console.log(label + '.samsungButtons=' + await page.getByRole('button', { name: 'Samsung', exact: true }).count());
            console.log(label + '.visibleDialogs=' + JSON.stringify(await visibleDialogs()));
          }

          try {
            await page.goto(PHONE, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await resolveKnownOverlays();
            await page.locator(CARD).first().waitFor({ state: 'attached', timeout: 30000 });
            await page.screenshot({ path: 'evidence/before.png', fullPage: false });

            const trigger = page.getByTestId('catalog--brand-filter--trigger');
            await trigger.waitFor({ state: 'visible', timeout: 15000 });
            console.log('trigger.outerHTML=' + await trigger.evaluate(el => el.outerHTML));
            const box = await trigger.boundingBox();
            console.log('trigger.box=' + JSON.stringify(box));
            if (!box) throw new Error('Brand trigger has no bounding box');
            const cx = box.x + box.width / 2;
            const cy = box.y + box.height / 2;
            console.log('trigger.centerElementChain=' + JSON.stringify(await describePoint(cx, cy)));
            await panelState('before');

            try {
              await trigger.click({ trial: true, timeout: 5000 });
              console.log('trialClick=success');
            } catch (error) {
              console.log('trialClick=failure ' + String(error).split('\n')[0]);
            }

            try {
              await trigger.click({ timeout: 8000 });
              console.log('normalClick=success');
            } catch (error) {
              console.log('normalClick=failure ' + String(error).split('\n')[0]);
            }
            await page.waitForTimeout(1500);
            await panelState('afterNormal');
            await page.screenshot({ path: 'evidence/after-normal.png', fullPage: false });

            if ((await trigger.getAttribute('aria-expanded')) !== 'true') {
              console.log('mouseClickDiagnostic=true');
              await page.mouse.click(cx, cy);
              await page.waitForTimeout(1500);
              await panelState('afterMouse');
              await page.screenshot({ path: 'evidence/after-mouse.png', fullPage: false });
            }

            if ((await trigger.getAttribute('aria-expanded')) !== 'true') {
              console.log('domClickDiagnostic=true');
              await trigger.evaluate(el => el.click());
              await page.waitForTimeout(1500);
              await panelState('afterDom');
              await page.screenshot({ path: 'evidence/after-dom.png', fullPage: false });
            }

            if ((await trigger.getAttribute('aria-expanded')) !== 'true') {
              console.log('forceClickDiagnostic=true');
              await trigger.click({ force: true });
              await page.waitForTimeout(1500);
              await panelState('afterForce');
              await page.screenshot({ path: 'evidence/after-force.png', fullPage: false });
            }

            console.log('final.centerElementChain=' + JSON.stringify(await describePoint(cx, cy)));
            console.log('VINTED_FILTER_TRIGGER_DIAGNOSTIC_DONE');
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          node audit.mjs
      - name: Upload trigger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinted-filter-trigger-evidence
          path: /tmp/vinted-filter-audit/evidence
          if-no-files-found: ignore
