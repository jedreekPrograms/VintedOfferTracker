spring:
  datasource:
    url: "jdbc:postgresql://localhost:5433/flipbot"
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  web:
    error:
      include-stacktrace: never
      include-exception: false

server:
  port: 8080