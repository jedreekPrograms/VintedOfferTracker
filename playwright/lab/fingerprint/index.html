<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlipBot Fingerprint Lab</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
        }
        pre {
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: auto;
        }
        button {
            padding: 9px 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>FlipBot Fingerprint Lab</h1>
<p>
    Local inspection page for learning which browser values are observable.
    The Java lab helper is restricted to localhost / reserved test domains.
</p>
<button id="refresh" type="button">Refresh snapshot</button>
<pre id="output"></pre>

<script>
    function snapshot() {
        return {
            location: location.href,
            platform: navigator.platform,
            hardwareConcurrency: navigator.hardwareConcurrency,
            deviceMemory: navigator.deviceMemory ?? null,
            language: navigator.language,
            languages: Array.from(navigator.languages || []),
            userAgent: navigator.userAgent,
            labMarker: window.__flipbotFingerprintLab ?? null,
        };
    }

    function render() {
        document.querySelector('#output').textContent =
            JSON.stringify(snapshot(), null, 2);
    }

    document.querySelector('#refresh').addEventListener('click', render);
    render();
</script>
</body>
</html>
